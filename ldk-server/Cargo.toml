[package]
name = "ldk-server"
version = "0.1.0"
authors = ["benthecarman <benthecarman@live.com>", "Elias Rohrer <dev@tnull.de>"]
homepage = "https://lightningdevkit.org/"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.85"
description = "A ready-to-run Lightning node daemon built using LDK Node."
repository = "https://github.com/lightningdevkit/ldk-server/"
readme = "README.md"
keywords = ["bitcoin", "lightning", "ldk", "server"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
# kaleidoswap fork: ldk-server's pinned ldk-node base (00dba456) + ldk-node#831
# "manually handle BOLT12 invoices" cherry-picked, for the BOLT12 fetch/pay-invoice
# RPCs. Drop back to upstream once #831 (or equivalent) lands there.
ldk-node = { git = "https://github.com/kaleidoswap/ldk-node", rev = "42ffda78fae7e1471c76adcef33da477a6c5e945" }
serde = { version = "1.0.203", default-features = false, features = ["derive"] }
hyper = { version = "1", default-features = false, features = ["server", "http2"] }
http-body-util = { version = "0.1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["server-graceful", "tokio"] }
tokio = { version = "1.38.0", default-features = false, features = ["time", "signal", "rt-multi-thread", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
ring = { version = "0.17", default-features = false }
getrandom = { version = "0.2", default-features = false }
prost = { version = "0.11.6", default-features = false, features = ["std"] }
ldk-server-grpc = { path = "../ldk-server-grpc" }
bytes = { version = "1.4.0", default-features = false }
hex = { package = "hex-conservative", version = "0.2.1", default-features = false }
rusqlite = { version = "0.31.0", features = ["bundled"] }
toml = { version = "0.8.9", default-features = false, features = ["parse"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4.28"
base64 = { version = "0.21", default-features = false, features = ["std"] }
clap = { version = "4.0.5", default-features = false, features = ["derive", "std", "error-context", "suggestions", "help", "env"] }

[features]
default = []

# Experimental Features.
experimental-lsps2-support = []

[dev-dependencies]
futures-util = "0.3.31"
