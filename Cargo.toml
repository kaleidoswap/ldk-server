[workspace]
resolver = "2"
members = ["ldk-server-cli", "ldk-server-client", "ldk-server-grpc", "ldk-server", "ldk-server-mcp"]
exclude = ["e2e-tests"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true

[profile.dev]
panic = "abort"

# Keep transitive payment-instructions dependencies on the same LDK accounting revision.
[patch."https://github.com/lightningdevkit/rust-lightning"]
lightning = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "6bb6160cd9e43bf88c6e78abf1b90eb4adc50002" }
lightning-types = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "6bb6160cd9e43bf88c6e78abf1b90eb4adc50002" }
lightning-invoice = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "6bb6160cd9e43bf88c6e78abf1b90eb4adc50002" }
lightning-net-tokio = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "6bb6160cd9e43bf88c6e78abf1b90eb4adc50002" }
lightning-persister = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "6bb6160cd9e43bf88c6e78abf1b90eb4adc50002" }
lightning-background-processor = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "6bb6160cd9e43bf88c6e78abf1b90eb4adc50002" }
lightning-rapid-gossip-sync = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "6bb6160cd9e43bf88c6e78abf1b90eb4adc50002" }
lightning-block-sync = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "6bb6160cd9e43bf88c6e78abf1b90eb4adc50002" }
