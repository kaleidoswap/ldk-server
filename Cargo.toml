[workspace]
resolver = "2"
members = ["ldk-server-cli", "ldk-server-client", "ldk-server-grpc", "ldk-server", "ldk-server-mcp", "ldk-server-macaroons"]
exclude = ["e2e-tests"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true

[profile.dev]
panic = "abort"

# ldk-node's fork of rust-lightning; bitcoin-payment-instructions pins upstream.
[patch."https://github.com/lightningdevkit/rust-lightning"]
lightning = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "893ec7f6d78a471ba2272837e3735724e123de60" }
lightning-invoice = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "893ec7f6d78a471ba2272837e3735724e123de60" }
lightning-types = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "893ec7f6d78a471ba2272837e3735724e123de60" }
lightning-macros = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "893ec7f6d78a471ba2272837e3735724e123de60" }
possiblyrandom = { git = "https://github.com/kaleidoswap/rust-lightning", rev = "893ec7f6d78a471ba2272837e3735724e123de60" }
